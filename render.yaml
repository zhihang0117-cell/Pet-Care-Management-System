services:
  - type: web
    name: pawfectai
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://pawfectai.onrender.com
      - key: AI_BACKEND_URL
        fromService:
          type: web
          name: pawfectai-ai
          property: host

      - key: AI_BACKEND_INTERNAL_KEY
        fromService:
          type: web
          name: pawfectai-ai
          envVarKey: INTERNAL_API_KEY
      - key: AI_BACKEND_TIMEOUT_MS
        value: "15000"
      - key: API_RATE_LIMIT_PER_MINUTE
        value: "120"

  - type: web
    name: pawfectai-ai
    runtime: python
    # BGE-Large (see EMBEDDING_MODEL below) is a local embedding model and
    # needs substantially more memory than Render's free instance. Change
    # this only if the model is externalized.
    plan: standard
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SUPABASE_URL
        fromService:
          type: web
          name: pawfectai
          envVarKey: SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          type: web
          name: pawfectai
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
      # This deployment is currently single-company. Set it explicitly so
      # production never relies on customer_context.py's local-dev fallback.
      - key: RELATIONAL_COMPANY_ID
        value: "1"
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: CHAT_API_KEY
        generateValue: true
      - key: PAWFECT_DEBUG_MODE
        value: "false"
      - key: TOOL_EXECUTOR_MAX_WORKERS
        value: "4"
      - key: TOOL_CALL_TIMEOUT_SECONDS
        value: "20"
      - key: EMBEDDING_PROVIDER
        value: sentence_transformers
      - key: EMBEDDING_MODEL
        value: BAAI/bge-large-en-v1.5
      - key: WHATSAPP_PROVIDER
        value: meta_cloud_api
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_GRAPH_API_VERSION
        sync: false
      - key: HF_HOME
        value: /opt/render/project/.cache/huggingface
      - key: SUPABASE_STORAGE_BUCKET
        value: business-documents
