services:
  - type: web
    name: pawfectai
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Render assigns <name>.onrender.com ONLY if that name is not already
      # taken by another Render account — if "pawfectai" turns out to be
      # taken, Render silently appends a random suffix instead and this
      # value stops matching the real deployed URL, which fails CORS with
      # no obvious error in this file. After the first deploy, open the
      # service in the Render dashboard and confirm its actual URL matches
      # this value exactly (scheme + host, no trailing slash) — update it
      # here (and redeploy) if it doesn't.
      - key: CORS_ORIGINS
        value: https://pawfectai.onrender.com
      # The Python AI service (app/, main.py) is NOT deployed on Render —
      # it runs on Google Cloud Run (see the "Google Cloud Run" deployment
      # notes in DEVELOPER_GUIDE.md / README.md for the exact gcloud
      # command). Fill these in manually with that service's real URL and
      # its INTERNAL_API_KEY after the Cloud Run deploy — there is no
      # `fromService` cross-reference possible here since Cloud Run isn't a
      # Render-managed service. callAiBackend() (src/lib/aiBackend.js)
      # requires the URL to include an explicit https:// scheme (a bare
      # hostname now safely defaults to https, not http, but an explicit
      # scheme is still clearer here).
      - key: CLOUD_RUN_AI_BACKEND_URL
        sync: false
      - key: CLOUD_RUN_AI_BACKEND_INTERNAL_KEY
        sync: false
      # Same value as Cloud Run's own CHAT_API_KEY env var — this is what
      # lets the public Demo page (web/console.html -> routes/demoChat.js)
      # reach /chat on the AI backend without ever exposing that key to a
      # visitor's browser. Must match exactly or the demo gets a 401.
      - key: CLOUD_RUN_AI_BACKEND_CHAT_KEY
        sync: false
      - key: AI_BACKEND_TIMEOUT_MS
        value: "15000"
      - key: AI_BACKEND_CHAT_TIMEOUT_MS
        value: "45000"
      - key: API_RATE_LIMIT_PER_MINUTE
        value: "120"
